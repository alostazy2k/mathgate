<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="assets/favicon.svg?v=4.3.3" type="image/svg+xml" />

<!-- The celebration. If this file never arrives, the engine draws its own —
     see burst() in engine.js. The moment must not depend on a CDN. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>

<body>

<a class="home-link" href="index.html">صفحتي <span aria-hidden="true">←</span></a>

<div class="wrap">

  <header class="masthead" id="hwHead" style="grid-template-columns:1fr"></header>

  <div class="hw-panel">
    <div id="hwIntro"></div>

    <form id="hwForm">
      <div class="student-row">
        <div class="field">
          <label for="sName">Full name <span class="req">*</span>
            <span class="ar-inline">— الاسم كامل</span></label>
          <input type="text" id="sName" name="student_name" required
                 placeholder="Ahmed Mohamed" autocomplete="name" />
        </div>
        <div class="field">
          <label for="sPhone">Mobile number <span class="req">*</span>
            <span class="ar-inline">— رقم الموبايل</span></label>
          <input type="tel" id="sPhone" name="student_phone" required
                 pattern="01[0-9]{9}" placeholder="01xxxxxxxxx"
                 inputmode="numeric" autocomplete="tel" />
        </div>
      </div>
      <div class="field">
        <label for="sEmail">Email <span class="optional">(optional)</span></label>
        <input type="email" id="sEmail" name="student_email" placeholder="ahmed@email.com" autocomplete="email" />
      </div>

      <div class="section-divider"><span>Part A — Auto-graded</span><hr /></div>
      <div id="hwAuto"></div>

      <div class="section-divider"><span>Part B — Written</span><hr /></div>
      <div id="hwManual"></div>

      <!-- The student's own voice. Optional, never validated, and it travels
           with the submission — so a question about the lesson reaches the
           teacher at the moment the student actually has it. -->
      <div class="note-box">
        <label for="sNote">ملاحظاتك <span class="optional">(اختياري)</span></label>
        <p class="note-hint">
          فيه حاجة في الدرس مش واضحة؟ سؤال في الواجب حسّيته صعب أو غامض؟
          اكتبها هنا وهتوصل للدكتور وسام مع واجبك.
        </p>
        <textarea id="sNote" name="student_note" rows="3"
                  placeholder="اكتب ملاحظتك هنا…"></textarea>
      </div>

      <button type="button" class="submit-btn" id="hwSubmit">Submit and send — إرسال</button>
    </form>

    <!-- filled by the engine: it needs L.next to build the next-lesson button -->
    <div class="status-msg" id="hwOk" hidden></div>

    <div class="status-msg error" id="hwErr" hidden>
      <h3>Submission failed</h3>
      <p id="hwErrText"></p>
      <div class="ar-note warn">
        <span class="ar-label">الإرسال ما نجحش</span>
        اتأكد إن النت شغال وحاول تاني. إجاباتك لسه موجودة في الصفحة.
      </div>
    </div>
  </div>

  <footer><strong>Dr. Wessam Gouda</strong> · Mathematics</footer>
</div>

<script src="assets/config.js?v=4.3.3"></script>
<script src="data/course.js?v=4.3.3"></script>
<script src="assets/student.js?v=4.3.3"></script>
<script src="assets/access.js?v=4.3.3"></script>
<script src="data/questions.js?v=4.3.3"></script>

<!-- the lesson's own data file, picked by ?id= — see the note in lesson.html -->
<script>
  (function () {
    var m = /[?&]id=([A-Za-z0-9_-]+)/.exec(location.search);
    var id = m ? m[1] : 'u1-l1';

    /* Which FILE holds this lesson is the `data` field in data/course.js, not
       the lesson id. They are usually the same string, and assuming so was a
       bug: it made `data` look like a filename while quietly ignoring it, so
       pointing two entries at one file — the fastest way to preview the
       platform before the lessons are recorded — loaded nothing. */
    var file = id;
    try {
      var C = window.COURSE;
      if (C) {
        if (C.demo && C.demo.id === id && C.demo.data) file = C.demo.data;
        else C.years.forEach(function (y) {
          (y.terms || []).forEach(function (t) {
            (t.units || []).forEach(function (u) {
              (u.lessons || []).forEach(function (l) {
                if (l.id === id && l.data) file = l.data;
              });
            });
          });
        });
      }
    } catch (e) { /* fall back to the id */ }

    if (!/^[A-Za-z0-9_-]+$/.test(file)) file = id;   /* never escape data/ */
    document.write('<scr' + 'ipt src="data/' + file + '.js?v=4.3.3"><\/scr' + 'ipt>');
  })();
</script>

<script src="assets/engine.js?v=4.3.3"></script>
<script>
  window.addEventListener('load', function () { MathPlatform.renderHomework(); });
</script>

</body>
</html>
