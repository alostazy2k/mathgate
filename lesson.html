<!--
  ==========================================================================
  LESSON PAGE TEMPLATE
  This file is identical for every lesson in the course. It contains no
  content at all — only the empty containers the engine fills.

  Which lesson it shows comes from the URL:  lesson.html?id=s1-u1-l4
  with `u1-l1` as the default, so old links keep working. Nothing in this
  file changes when a lesson is added — only a new file in data/ and a line
  in data/course.js.

  ACCORDION UPDATE (27 Sept 2026): everything after the video is now grouped
  into four collapsible <details> sections — Lesson Explanation, Interactive
  examples, Self-assessment quiz, Homework page — all collapsed by default,
  so the page never looks longer than one screenful at a glance. This is a
  markup/CSS-only change: engine.js still fills #theory / #exercises / #quiz
  / #next exactly as before — it has no idea they now sit one level deeper
  inside a <details> wrapper. The "Homework page" section is a thin wrapper
  around the existing #next block (the same "go to homework" button and unit
  progress bar that lived here before) — the homework FORM itself still lives
  on its own page, homework.html; nothing about that changed.
  ==========================================================================
-->

<!-- KaTeX: renders synchronously and is a fraction of MathJax's weight.
     `.katex { font-size: 1.12em }` in theme.css is the size control that
     MathJax's options.scale was silently ignoring. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" />
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>

<!-- Apply the saved colour mode BEFORE the first paint. If this waited for a
     script at the end of the body, the page would flash the wrong colours for
     an instant on every load, which reads as a bug. Four lines, no dependencies. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('wg:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<!-- ===== the lesson's own data file, picked by ?id= =====================
     document.write is deliberate here. It is the one technique that keeps a
     dynamically chosen script in the parser's execution order on a static
     site with no build step — so engine.js below still finds window.LESSON
     already defined, exactly as it did when this line was hard-coded.
     The id is filtered to [A-Za-z0-9_-] so it can never escape data/.
     ===================================================================== -->
<script>
  (function () {
    var m = /[?&]id=([A-Za-z0-9_-]+)/.exec(location.search);
    var id = m ? m[1] : 'u1-l1';

    /* Which FILE holds this lesson is the `data` field in data/course.js, not
       the lesson id. They are usually the same string, and assuming so was a
       bug: it made `data` look like a filename while quietly ignoring it, so
       pointing two entries at one file — the fastest way to preview the
       platform before the lessons are recorded — loaded nothing. */
    var file = id;
    try {
      var C = window.COURSE;
      if (C) {
        if (C.demo && C.demo.id === id && C.demo.data) file = C.demo.data;
        else C.years.forEach(function (y) {
          (y.terms || []).forEach(function (t) {
            (t.units || []).forEach(function (u) {
              (u.lessons || []).forEach(function (l) {
                if (l.id === id && l.data) file = l.data;
              });
            });
          });
        });
      }
    } catch (e) { /* fall back to the id */ }

    if (!/^[A-Za-z0-9_-]+$/.test(file)) file = id;   /* never escape data/ */
    document.write('<scr' + 'ipt src="data/' + file + '.js?v=4.5"><\/scr' + 'ipt>');
  })();
</script>

<script src="assets/engine.js?v=4.5"></script>
